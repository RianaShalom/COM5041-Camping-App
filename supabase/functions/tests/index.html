<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
<h1>Login</h1>
<p id="login"></p>
<button onclick="login()">Login</button>

<h1>Signup</h1>
<p id="signup"></p>
<button onclick="signup()">Signup</button>

<h1>Logout</h1>
<p id="logout"></p>
<button onclick="logout()">Logout</button>

<h1>Search</h1>
<label>place:<input type="text" name="place" required></label>
<p id="search"></p>
<button onclick="search()">Search</button>

<h1>Get User's campsites</h1>
<p id="get-campsites"></p>
<button onclick="getCampsites()">Get User's campsites</button>

<script>
    let jwt = null;
    let campsites = [];
    let preferredCampsites = [];
    
    async function login() {
        const response = await fetch('https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ "email": "xxx", "password": "xxx" })
        });

        if (response.ok) {
            const data = await response.json();
            document.getElementById('login').innerText = `Login successful! Token: ${JSON.stringify(data)}`;
            jwt = data.token;
        } else {
            document.getElementById('login').innerText = 'Login failed!';
        }
    }

    async function signup() {
        const response = await fetch('https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/auth/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ "email": "xxx", "password": "xxx" })
        });

        if (response.ok) {
            const data = await response.json();
            document.getElementById('signup').innerText = `Signup successful! Token: ${JSON.stringify(data)}`;
        } else {
            document.getElementById('signup').innerText = 'Signup failed!';
        }
    }


    async function logout() {
        const response = await fetch('https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/auth/logout', {
            method: 'GET',
            headers: {'Authorization': `Bearer ${jwt}`},
        });

        if (response.ok) {
            document.getElementById('logout').innerText = 'Logout successful!';
        } else {
            document.getElementById('logout').innerText = 'Logout failed!';
        }
    }

    async function search() {
        const place = document.querySelector('input[name="place"]').value;
        try {
            const response = await fetch(`https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/search?place=${place}`);
            if (response.ok) {
                campsites = await response.json();
                console.log("Campsite search: ", JSON.stringify(campsites, null, 2));
                const content = campsites.map(
                    (item, i) => {
                        return `<div>
                        <h2>${item.name}</h2>
                        <p>Longitude: ${Math.trunc(item.longitude * 10000) / 10000}</p>
                        <p>Latitude: ${Math.trunc(item.latitude * 10000) / 10000}</p>
                        <p>${item.address}</p>
                        <input type="checkbox" id="campsite${i}" name="campsite${i}" value="${item.id}">
                    </div>`;
                    },
                )
                content.push('<button onclick="selectCampsite()">Select</button>')
                document.getElementById("search").innerHTML = content.join("");
            } else {
                console.error("Failed to search place", response);
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    async function selectCampsite() {
        if (!jwt) {
            console.error("User not logged in");
            return;
        }
        const selected = document.querySelectorAll('input[type="checkbox"]:checked');
        console.log("selected", Array.from(selected).map((el) => campsites[el.id.replace('campsite', '')]));
        if (selected.length === 0) {
            console.error("No campsite selected");
            return;
        }
        try {
            const response = await fetch("https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/campsite", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${jwt}`,
                },
                body: JSON.stringify({campsite: Array.from(selected).map((el) => campsites[el.id.replace('campsite', '')])}),
            });
            if (response.ok) {
                const data = await response.json();
                console.log("Selected Campsite resp: ", data);
            } else {
                console.error("Failed to add campsite", response);
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    async function getCampsites() {
        if (!jwt) {
            console.error("User not logged in");
            return;
        }
        try {
            const response = await fetch("https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/campsite", {
                method: "GET",
                headers: {"Authorization": `Bearer ${jwt}`},
            });
            if (response.ok) {
                preferredCampsites = await response.json();
                const content = preferredCampsites.map(
                    (item, i) => {
                        return `<div>
                        <h2>${item.name}</h2>
                        <p>Longitude: ${Math.trunc(item.longitude * 10000) / 10000}</p>
                        <p>Latitude: ${Math.trunc(item.latitude * 10000) / 10000}</p>
                        <p>${item.address}</p>
                        <p>${item.rating}</p>
                        <p>${item.weather.elevation}</p>
                        <p>${JSON.stringify(item.weather.days[0])}</p>
                        <input type="text" id="rating${i}" name="rating${i}" value="">
                        <button onclick="updateCampsiteRating(${i})">Update rating</button>
                        <button onclick="deleteCampsite(${i})">Delete</button>
                    </div>`;
                    },
                )
                document.getElementById('get-campsites').innerHTML = content.join("");
            } else {
                console.error("Failed to get campsites", response);
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    async function updateCampsiteRating(index) {
        if (!jwt) {
            console.error("User not logged in");
            return;
        }
        const ratings = document.querySelectorAll('input[type="text"]');
        console.log(index, Array.from(ratings).length, Array.from(ratings)[index + 1].value);
        preferredCampsites[index].rating = Array.from(ratings)[index + 1].value;
        console.log(preferredCampsites[index])
        try {
            const response = await fetch("https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/campsite", {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${jwt}`,
                },
                body: JSON.stringify(preferredCampsites[index]),
            });
            if (response.ok) {
                const data = await response.json();
                console.log("Campsite rating resp: ", data);
            } else {
                console.error("Failed to update campsite rating", response);
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }

    async function deleteCampsite(index) {
        if (!jwt) {
            console.error("User not logged in");
            return;
        }
        const campsiteId = preferredCampsites[index].id;
        try {
            const response = await fetch(`https://hnxfgutvgswxxvzctxto.supabase.co/functions/v1/campsite?id=${campsiteId}`, {
                method: "DELETE",
                headers: {"Authorization": `Bearer ${jwt}`},
            });
            if (response.ok) {
                const data = await response.json();
                console.log("Deleted campsite resp: ", data);
            } else {
                console.error("Failed to delete campsite", response);
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }
</script>
</body>
</html>
